
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Eval and Variables</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            padding: 30px;
            text-align: center;
        }

        .container {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 450px;
            margin: auto;
        }

        input, button {
            padding: 10px;
            margin: 8px;
            font-size: 16px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Evaluate an Expression</h2>

        <p>Enter a mathematical expression:</p>

        <input type="text" id="expression"
               value="10 + 20">

        <br>

        <button onclick="calculate()">Evaluate</button>

        <p id="result">Result will appear here</p>
    </div>

    <script>
        function calculate() {
            let expression =
                document.getElementById("expression").value;

            let result = eval(expression);

            document.getElementById("result").textContent =
                "Result: " + result;
        }
    </script>

</body>
</html>
